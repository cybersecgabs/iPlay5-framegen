# Push a tag like v0.4.1 to build an unsigned IPA, attach it to a GitHub
# release and add it to the SideStore/AltStore source.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      # Submodules are only fetched by the ChiakiKit action on a cache miss
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore or build ChiakiKit.xcframework
        uses: ./.github/actions/chiakikit
        with:
          slices: "ios sim"
          save: "false"

      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          # Newer Xcodes ship the Metal compiler as a separate download
          xcodebuild -showComponent MetalToolchain >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project and run unit tests
        run: |
          xcodegen generate
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -E "iPhone (18|17|16|15)" | grep -E '\([0-9A-F-]{36}\)' | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available iPhone | grep -E '\([0-9A-F-]{36}\)' | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
          fi
          if [ -z "$SIM_ID" ]; then
            echo "ERROR: No available iPhone Simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project iPlay5.xcodeproj \
            -scheme iPlay5 \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:iPlay5Tests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Build and verify IPA
        run: |
          chmod +x scripts/*.sh
          VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}" scripts/package-ipa.sh
          scripts/verify-ipa.sh build/iPlay5.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/iPlay5.ipa --title "iPlay5 $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" build/iPlay5.ipa --clobber

      - name: Update sideload source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -- App/Info.plist || true
          git checkout -B main origin/main
          scripts/update-source.sh "${GITHUB_REF_NAME#v}" build/iPlay5.ipa \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/iPlay5.ipa"
          git add altstore-source.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add ${GITHUB_REF_NAME} to sideload source"
            git pull --rebase origin main
            git push origin main
          fi
