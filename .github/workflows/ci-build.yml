name: Build and Validate IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Test and Package Unsigned IPA
    runs-on: macos-26
    steps:
      # Submodules are only fetched by the ChiakiKit action on a cache miss
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore or build ChiakiKit.xcframework
        uses: ./.github/actions/chiakikit
        with:
          slices: "ios sim"
          save: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -showComponent MetalToolchain >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -E "iPhone (18|17|16|15)" | grep -E '\([0-9A-F-]{36}\)' | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available iPhone | grep -E '\([0-9A-F-]{36}\)' | head -n 1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/' || true)
          fi
          if [ -z "$SIM_ID" ]; then
            echo "ERROR: No available iPhone Simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project iPlay5.xcodeproj \
            -scheme iPlay5 \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:iPlay5Tests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Build unsigned Release IPA (iOS device)
        run: |
          chmod +x scripts/*.sh
          VERSION="0.4.1" BUILD_NUMBER="${{ github.run_number }}" scripts/package-ipa.sh

      - name: Verify IPA bundle
        run: scripts/verify-ipa.sh build/iPlay5.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPlay5-FrameGen-ipa
          path: build/iPlay5.ipa
          if-no-files-found: error
